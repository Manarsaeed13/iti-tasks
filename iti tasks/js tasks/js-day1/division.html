    <script>

  let input = prompt("Enter a number:");
    let num = Number(input);
    let result;
    if (num % 3 == 0 && num % 5 == 0) {
      result = "fizz buzz";
    } else if (num % 3 == 0) {
      result = "fizz";
    } else if (num % 5 == 0) {
      result = "buzz";
    } else {
      result = "none";
    }
    alert(result);
  

    </script>
