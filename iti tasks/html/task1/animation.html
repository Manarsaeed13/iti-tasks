<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 50px;
  }

  .circle {
    width: 100px;
    height: 100px;
    background-color: rgb(30, 0, 128);
    border-radius: 50%;
    margin: 0 auto;
    animation-iteration-count: infinite;
    animation-name: manar;
    animation-duration: 5s;
    
  }

  @keyframes manar {
    0% {
      background-color: rgb(30, 0, 128);
      transform: translateX(0) scale(1);
    }
    25% {
      background-color: orange;
      transform: translateX(150px) scale(1.3);
    }
    50% {
      background-color: teal;
      transform: translateX(0) scale(1.6);
    }
    75% {
      background-color: crimson;
      transform: translateX(-150px) scale(1.3);
    }
    100% {
      background-color: rgb(30, 0, 128);
      transform: translateX(0) scale(1);
    }
  }
</style>
</head>
<body>

<h1>Manar Saeed</h1>

<div class="circle"></div>

</body>
</html>
